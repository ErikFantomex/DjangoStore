<div class="app-shell">
  <header class="topbar">
    <div class="header-inner">
      <a class="brand" routerLink="/" aria-label="MesaViva, inicio">
        <img class="brand-mark" src="/mesaviva.png" alt="">
        MesaViva
      </a>
      <nav aria-label="Navegación principal">
        <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
        <a routerLink="/recetas" routerLinkActive="active" ariaCurrentWhenActive="page">Recetas</a>
        <a routerLink="/planes" routerLinkActive="active" ariaCurrentWhenActive="page">Planes</a>
        <a routerLink="/comidas" routerLinkActive="active" ariaCurrentWhenActive="page">Comidas</a>
        <a routerLink="/datos-nutricionales" routerLinkActive="active" ariaCurrentWhenActive="page">Alimentos</a>
        <a routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page">Perfil</a>
      </nav>
      <button type="button" class="session btn secondary" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
