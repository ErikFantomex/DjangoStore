<main class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">Nueva cuenta</p>
    <h1>Crear cuenta</h1>
    @if (error) { <p class="error">{{ error }}</p> }
    <div class="field">
      <label for="name">Nombre</label>
      <input id="name" formControlName="name" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Correo electronico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password">
    </div>
    <button class="btn" type="submit" [disabled]="form.invalid">Crear cuenta</button>
    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesion</a></p>
  </form>
</main>
