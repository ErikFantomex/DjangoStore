<main class="auth-page">
  <div class="auth-sheet">
    <div class="auth-intro">
      <div class="brand"><img class="brand-mark" src="/mesaviva.png" alt=""> MesaViva</div>
      <div>
        <h2>Haz espacio para nuevas recetas.</h2>
        <p>Guarda las que te gustan y prepara un menú que se adapte a tu semana.</p>
      </div>
    </div>
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Crear cuenta</h1>
    @if (error) { <p class="error" role="alert">{{ error }}</p> }
    <div class="field">
      <label for="name">Nombre</label>
      <input id="name" formControlName="name" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password">
    </div>
    <button class="btn" type="submit" [disabled]="form.invalid">Crear cuenta</button>
    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p>
    </form>
  </div>
</main>
