<div class="page">
  <div class="page-header"><h1>Mi perfil</h1></div>
  <form class="card profile-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (message) { <p class="muted">{{ message }}</p> }
    <div class="field">
      <label for="name">Nombre</label>
      <input id="name" formControlName="name">
    </div>
    <div class="field">
      <label for="email">Correo electronico</label>
      <input id="email" type="email" formControlName="email">
    </div>
    <div class="field">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="Dejar vacio para conservarla">
    </div>
    <button class="btn" type="submit" [disabled]="form.invalid">Guardar cambios</button>
  </form>
</div>
