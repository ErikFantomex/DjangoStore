<div class="page">
  <div class="page-header"><div><h1>Mi perfil</h1><p class="muted">Actualiza los datos con los que accedes a MesaViva.</p></div></div>
  <form class="card profile-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (message) { <p class="muted" role="status">{{ message }}</p> }
    <div class="field">
      <label for="name">Nombre</label>
      <input id="name" formControlName="name" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" placeholder="Déjala en blanco para conservarla">
    </div>
    <button class="btn" type="submit" [disabled]="form.invalid">Guardar cambios</button>
  </form>
</div>
