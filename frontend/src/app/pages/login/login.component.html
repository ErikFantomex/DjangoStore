<main class="auth-page">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">Acceso seguro</p>
    <h1>Bienvenido</h1>
    <p class="muted">Administra pacientes, recetas y planes de alimentación.</p>
    @if (error) { <p class="error">{{ error }}</p> }
    <div class="field">
      <label for="email">Correo electronico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit" [disabled]="form.invalid">Iniciar sesion</button>
    <p class="auth-link">¿No tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
  </form>
</main>
