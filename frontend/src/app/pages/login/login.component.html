<main class="auth-page">
  <div class="auth-sheet">
    <div class="auth-intro">
      <div class="brand"><img class="brand-mark" src="/mesaviva.png" alt=""> MesaViva</div>
      <div>
        <h2>Qué comer, sin darle tantas vueltas.</h2>
        <p>Encuentra ideas con tus ingredientes y organiza tus comidas en un solo lugar.</p>
      </div>
    </div>
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Inicia sesión</h1>
    @if (error) { <p class="error" role="alert">{{ error }}</p> }
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit" [disabled]="form.invalid">Iniciar sesión</button>
    <p class="auth-link">¿No tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>
    </form>
  </div>
</main>
