{% extends "base.html" %}

{% block content %}
<h2>Mis planes de comida</h2>
<ul>
{% for mealplan in mealplans %}
  <li>
    <a href="{% url 'core:mealplan-detail' mealplan.pk %}">
      {{ mealplan.meal_plan_id }} - {{ mealplan.client_name }}
    </a>
  </li>
{% empty %}
  <li>No hay planes registrados.</li>
{% endfor %}
</ul>
{% endblock %}
